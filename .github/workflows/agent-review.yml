name: Agent access review
on:
  workflow_dispatch:
  schedule:
    - cron: '50 15 * * 1'
permissions:
  contents: write
concurrency:
  group: agent-review
  cancel-in-progress: false
jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Export traffic, check live files and the MCP server, prune old rows
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: node frontend/scripts/agent-review.mjs
      - name: Commit the export
        run: |
          git config user.name "agent-review[bot]"
          git config user.email "agent-review@users.noreply.github.com"
          git add docs/agent-review
          if git diff --cached --quiet; then echo "No changes to commit"; exit 0; fi
          git commit -m "Add weekly agent access review export"
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"
