name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build
      - run: node --test tests/astrology.test.mjs
      - run: npm run test:herbs
      - run: npm run test:map
      - run: npm run test:motion
      - run: npm run test:navigation
      - run: npm run test:seo
      - run: npm run test:planning
      - run: npm run test:agent
      - run: npm run test:privacy
      - run: node --test tests/audit-regressions.test.mjs

  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: agent_traffic_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: sqlite:////tmp/utah-forage-ci.db
      SECRET_KEY: ci-only-secret
      TEST_POSTGRES_URL: postgresql+psycopg://postgres:ci@localhost:5432/agent_traffic_test
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip
      - run: pip install -r requirements.txt
      - run: alembic upgrade head
      - run: python -m scripts.seed
      - run: python -m unittest discover -s tests -v
      - run: python -m scripts.delivery_smoke
      - run: python -m scripts.auth_smoke
      - run: python -m scripts.import_smoke
      - run: python -m compileall app crawler scripts
